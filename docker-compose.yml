services:
  # Laravel App Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
    - "8080:80"
    volumes:
    - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_DATABASE: elgon_lab_inventory
      DB_USERNAME: laravel_user
      DB_PASSWORD: secret_password
    depends_on:
    - mysql_db
    networks:
    - app-network

  # Dedicated MySQL database container
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: elgon_lab_inventory
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
    - "3310:3306"
    volumes:
    - db_data:/var/lib/mysql
    networks:
    - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
